<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kiro Demo — Catalog</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="demo-badge">DEMO — 非公式</div>
      <img class="logo" src="assets/kiro-icon.svg" alt="Kiro">
      <h1>Kiro — Catalog (Demo)</h1>
      <nav class="site-nav"><a href="index.html">Home</a> · <a href="catalog.html">Catalog</a></nav>
    </header>

    <main class="content">
      <h2>Sample Tracks</h2>
      <p class="note">音源と購入はデモです。実際の取引は発生しません。</p>

      <ul class="track-list">
        <li>
          <div class="track-meta">
            <strong>Track 1 — Sunrise</strong>
            <span class="artist">Artist A</span>
          </div>
          <div class="track-actions">
            <button disabled class="btn play">Play (demo)</button>
            <button class="btn buy">Buy — ¥120</button>
          </div>
        </li>
        <li>
          <div class="track-meta">
            <strong>Track 2 — Night Drive</strong>
            <span class="artist">Artist B</span>
          </div>
          <div class="track-actions">
            <button disabled class="btn play">Play (demo)</button>
            <button class="btn buy">Buy — ¥150</button>
          </div>
        </li>
        <li>
          <div class="track-meta">
            <strong>Track 3 — Reflections</strong>
            <span class="artist">Artist C</span>
          </div>
          <div class="track-actions">
            <button disabled class="btn play">Play (demo)</button>
            <button class="btn buy">Buy — ¥100</button>
          </div>
        </li>
      </ul>
    </main>

    <footer class="site-footer">
      <p>このページはサンプルです。©2025 Kiro (Demo)</p>
    </footer>
  </body>
</html>
